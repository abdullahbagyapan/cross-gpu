# SPDX-License-Identifier: MIT
name: Environment Emulation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 0" # Weekly Sunday 05:00 UTC
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - ".github/workflows/emulation.yml"
      - "scripts/emulate.sh"
      - "scripts/shims/**"
      - "Makefile"

permissions:
  contents: read

jobs:
  backends-emulation:
    name: Backend Emulation (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - backend-cuda
          - backend-hip
          - backend-levelzero
          - backend-opencl
          - backend-metal
          - backend-multigpu
          - backend-pocl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Docker emulation target ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/emulate.sh \
            --target "${{ matrix.target }}" \
            --skip-binfmt \
            --log-dir "${RUNNER_TEMP}/emulation-logs"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          if [[ -f "${RUNNER_TEMP}/emulation-logs/summary.md" ]]; then
            cat "${RUNNER_TEMP}/emulation-logs/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### ${{ matrix.target }}: emulation exited before writing summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulation-logs-${{ matrix.target }}
          path: ${{ runner.temp }}/emulation-logs/
          retention-days: 14
          if-no-files-found: ignore

  arch-emulation:
    name: Architecture Emulation (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch-amd64
          - arch-arm64
          - arch-riscv64
          - arch-ppc64le
          - arch-s390x
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU binfmt_misc
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,riscv64,ppc64le,s390x

      - name: Run Docker emulation target ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/emulate.sh \
            --target "${{ matrix.target }}" \
            --skip-binfmt \
            --log-dir "${RUNNER_TEMP}/emulation-logs"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          if [[ -f "${RUNNER_TEMP}/emulation-logs/summary.md" ]]; then
            cat "${RUNNER_TEMP}/emulation-logs/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### ${{ matrix.target }}: emulation exited before writing summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulation-logs-${{ matrix.target }}
          path: ${{ runner.temp }}/emulation-logs/
          retention-days: 14
          if-no-files-found: ignore

  distro-emulation:
    name: Distro Emulation (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - distro-alpine
          - distro-debian
          - distro-fedora
          - distro-arch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Docker emulation target ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/emulate.sh \
            --target "${{ matrix.target }}" \
            --skip-binfmt \
            --log-dir "${RUNNER_TEMP}/emulation-logs"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          if [[ -f "${RUNNER_TEMP}/emulation-logs/summary.md" ]]; then
            cat "${RUNNER_TEMP}/emulation-logs/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### ${{ matrix.target }}: emulation exited before writing summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulation-logs-${{ matrix.target }}
          path: ${{ runner.temp }}/emulation-logs/
          retention-days: 14
          if-no-files-found: ignore

  adversarial-emulation:
    name: Adversarial Constraints (Offline, Read-Only, noexec /tmp, UID 65534)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Docker emulation target adversarial
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/emulate.sh \
            --target adversarial \
            --skip-binfmt \
            --log-dir "${RUNNER_TEMP}/emulation-logs"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          if [[ -f "${RUNNER_TEMP}/emulation-logs/summary.md" ]]; then
            cat "${RUNNER_TEMP}/emulation-logs/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### adversarial: emulation exited before writing summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulation-logs-adversarial
          path: ${{ runner.temp }}/emulation-logs/
          retention-days: 14
          if-no-files-found: ignore
