[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-gpu"
dynamic = ["version"]
description = "Cross-platform GPU stress-testing CLI written exclusively with the Python 3 standard library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
authors = [
  { name = "CrossGPU Contributors" },
]
keywords = ["gpu", "stress-test", "cuda", "hip", "level-zero", "metal", "opencl", "telemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: System :: Benchmark",
]

[project.scripts]
cross-gpu = "cross_gpu.cli:main"

[tool.setuptools]
packages = ["cross_gpu", "cross_gpu.backends", "cross_gpu.telemetry", "cross_gpu.workloads"]
package-dir = {"cross_gpu" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "cross_gpu.__version__" }

[tool.setuptools.package-data]
cross_gpu = [
    "kernels/*/*.cu",
    "kernels/*/*.hip",
    "kernels/*/*.cl",
    "kernels/*/*.metal",
]
